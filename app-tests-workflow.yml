# Copy this file to .github/workflows/app-tests.yml at the repo root once
# the app/ directory is placed under application/ per the project's
# expected repo structure. Adjust the path below if you name it differently.

name: Application Tests

on:
  pull_request:
    paths:
      - "application/**"
  push:
    branches: [main]
    paths:
      - "application/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest -v
